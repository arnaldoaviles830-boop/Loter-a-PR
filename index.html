<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06101f" />
  <meta name="description" content="Suite modular de análisis estadístico para juegos de Lotería PR." />
  <link rel="manifest" href="./assets/manifest.json" />
  <title>Lotería PR · V4.0 Modular</title>
  <style><link rel="stylesheet" href="./css/app.css" />>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">PR</div><div><h1>Lotería PR</h1><small>Arquitectura modular · V4.0</small></div></div>
    <div class="top-actions">
      <button class="btn" id="exportBtn">⬇ <span>Respaldo</span></button><button class="btn" id="excelBtn">▦ <span>Excel</span></button><button class="btn" id="pdfBtn">▣ <span>PDF</span></button><button class="btn" id="themeBtn">◐ <span>Tema</span></button>
      <label class="btn">⬆ <span>Importar</span><input id="importFile" type="file" accept="application/json" hidden></label>
      <button class="btn danger" id="resetBtn">↺ <span>Reiniciar</span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="nav" id="desktopNav"></nav>
      <div class="side-note"><b>Importante</b><br>Esta herramienta describe patrones históricos. Ninguna combinación tiene garantía de premio y los sorteos son aleatorios.</div>
    </aside>

    <main class="main">
      <div class="mobile-nav" id="mobileNav"></div>
      <section class="hero">
        <div><span class="pill good">● Datos guardados en este dispositivo</span><h2 id="heroTitle">Resumen</h2><p id="heroText">Vista general de tus sorteos y tendencias.</p><div class="game-tabs" id="gameTabs"></div></div>
        <div><span class="sub">Sorteos registrados</span><div class="metric cyan" id="drawCount">0</div></div>
      </section>
      <section id="view"></section>
      <footer class="footer">Lotería PR V1 · Funciona sin servidor y guarda datos en el navegador.</footer>
    </main>
  </div>
</div>
<nav class="mobile-dock hidden" id="mobileDock"></nav>
<div class="toast hidden" id="toast"></div>

<script src="./js/v4/config.js" defer></script>
<script src="./js/v4/storage.js" defer></script>
<script src="./js/v4/sync.js" defer></script>
<script src="./js/app.js" defer></script>
</body>
</html>
